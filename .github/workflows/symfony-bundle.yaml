name: Symfony bundle tests

# Runs the PHPUnit suite against every maintained Symfony version
# (https://symfony.com/releases.json), each on every non-EOL PHP version (https://endoflife.date/php) it supports.

on:
    workflow_call:

permissions:
    contents: read

jobs:
    matrix:
        runs-on: ubuntu-latest
        name: Resolve maintained Symfony versions
        outputs:
            matrix: ${{ steps.matrix.outputs.matrix }}
        steps:
            -   name: Build matrix from symfony.com/releases.json
                id: matrix
                shell: python
                run: |
                    import datetime, json, os, sys, time, urllib.request

                    def fetch(url, attempts=3):
                        request = urllib.request.Request(url, headers={'User-Agent': 'symsensor-ci'})
                        for attempt in range(1, attempts + 1):
                            try:
                                with urllib.request.urlopen(request, timeout=20) as response:
                                    return json.load(response)
                            except Exception as error:
                                if attempt == attempts:
                                    sys.exit(f'Could not fetch {url} after {attempts} attempts: {error}')
                                time.sleep(2 ** attempt)

                    key = lambda v: tuple(int(p) for p in v.split('.'))
                    today = datetime.date.today().isoformat()

                    symfony = fetch('https://symfony.com/releases.json')
                    latest = key(symfony['latest_stable_version'])[:2]
                    # skip maintained branches without a stable release yet (e.g. the upcoming minor)
                    symfony_versions = [v for v in symfony['maintained_versions'] if key(v) <= latest]

                    # released PHP versions that have not reached their end of life yet
                    php_versions = sorted(
                        (c['cycle'] for c in fetch('https://endoflife.date/api/php.json')
                         if c['releaseDate'] <= today < c['eol']),
                        key=key,
                    )

                    include = []
                    for version in symfony_versions:
                        min_php = key('.'.join(symfony['min_php_requirements'][version].split('.')[:2]))
                        supported = [php for php in php_versions if key(php) >= min_php]
                        for php in supported:
                            include.append({'symfony': version, 'php': php})
                    with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                        out.write('matrix=' + json.dumps({'include': include}) + '\n')

    test:
        needs: matrix
        runs-on: ubuntu-latest
        name: PHPUnit Tests (PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }})
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Setup PHP
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version: ${{ matrix.php }}
                    ini-values: zend.exception_ignore_args=false
                    tools: flex

            -   name: Get composer cache directory
                id: composerCache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   name: Cache dependencies
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: ${{ steps.composerCache.outputs.dir }}
                    key: ${{ runner.os }}-composer-${{ matrix.symfony }}-${{ hashFiles('**/composer.json') }}
                    restore-keys: ${{ runner.os }}-composer-${{ matrix.symfony }}-

            -   name: Install dependencies
                run: |
                    export SYMFONY_REQUIRE=${{ matrix.symfony }}.*
                    composer global config --no-plugins allow-plugins.symfony/flex true
                    composer global require --no-progress --no-scripts --no-plugins symfony/flex
                    composer update --prefer-dist --no-progress

            -   name: Verify installed Symfony versions
                # SYMFONY_REQUIRE does not override non-intersecting root constraints, so make sure every directly required
                # Symfony package of the release train was really installed in the tested version
                shell: python
                run: |
                    import json, re, subprocess, sys

                    expected = '${{ matrix.symfony }}'
                    # not versioned together with the framework
                    independent = re.compile(r'^symfony/(flex|monolog-bundle|maker-bundle|ux-.*|.*-contracts|polyfill-.*|.*-pack)$')
                    out = subprocess.run(['composer', 'show', '--direct', '--format=json'], capture_output=True, text=True, check=True).stdout
                    mismatches = []
                    for package in json.loads(out)['installed']:
                        name, version = package['name'], package['version'].lstrip('v')
                        if name.startswith('symfony/') and not independent.match(name):
                            print(f'{name}: {version}')
                            if not version.startswith(expected + '.'):
                                mismatches.append(f'{name} {version}')
                    if not mismatches:
                        sys.exit(0)
                    sys.exit(f'::error::Expected Symfony {expected}, got: ' + ', '.join(mismatches))

            -   name: Run tests
                run: vendor/bin/phpunit
